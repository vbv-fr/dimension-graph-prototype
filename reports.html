<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta name="color-scheme" content="light">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FRINKS.AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
<style>
/* Light only, as the app (index.css: color-scheme light). Values are the Tailwind classes used in frinksedge-report-frontend. */
:root{
  --primary:#ff4301; --dp:#e85d04; --dp-soft:#fff3ee;
  --white:#fff; --black:#000; --g50:#f9fafb; --g100:#f3f4f6; --g200:#e5e7eb; --g300:#d1d5db; --g400:#9ca3af; --g500:#6b7280;
  --g600:#4b5563; --g700:#374151; --g800:#1f2937; --g900:#111827;
  --overlay:rgba(107,114,128,.75); --sidebar:#1e1c1c;
  --green50:#f0fdf4; --green600:#16a34a; --green700:#15803d; --red50:#fef2f2; --red500:#ef4444; --red600:#dc2626;
  --orange50:#fff7ed; --orange600:#ea580c; --blue50:#eff6ff; --blue500:#3b82f6; --blue600:#2563eb; --indigo800:#3730a3;
  --shadow-sm:0 1px 2px 0 rgba(0,0,0,.05);
  --shadow-md:0 4px 6px -1px rgba(0,0,0,.1),0 2px 4px -2px rgba(0,0,0,.1);
  --shadow-lg:0 10px 15px -3px rgba(0,0,0,.1),0 4px 6px -4px rgba(0,0,0,.1);
  --shadow-xl:0 20px 25px -5px rgba(0,0,0,.1),0 8px 10px -6px rgba(0,0,0,.1);
}
*{box-sizing:border-box;margin:0;padding:0;border:0 solid var(--g200)}
[hidden]{display:none !important}
html,body{font-size:16px;height:100vh;width:100vw;overflow-y:hidden;color:#000;background:#fff}
:root{font-family:'Outfit',sans-serif;line-height:1.5;font-weight:400;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{font-family:'Outfit',sans-serif;overflow-x:hidden}
button,input{font:inherit;color:inherit;line-height:inherit}
button{background:none;cursor:pointer}
button:disabled{cursor:default}
.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;display:block}
.i14{width:14px;height:14px} .i18{width:18px;height:18px}

/* ---- Sidebar (shared/layouts/main/sidebar.jsx, collapsed as the app opens by default) ---- */
.side{position:fixed;left:0;top:0;z-index:100;width:114px;height:100vh;display:flex;flex-direction:column;align-items:center;overflow:hidden;white-space:nowrap;
  padding:24px 8px;background:var(--sidebar);border-right:1px solid var(--g300);box-shadow:var(--shadow-md)}
.logo{display:flex;align-items:center;justify-content:center;overflow:hidden;margin:12px 0 40px}
.nav{margin-top:32px;flex:1;width:100%;list-style:none;display:flex;flex-direction:column;gap:8px}
.nav a{display:flex;align-items:center;border-radius:6px;padding:8px 36px;color:#fff;overflow:hidden}
.nav a:hover{background:rgba(255,255,255,.2)}
.nav .ib{display:flex;width:24px;flex-shrink:0;align-items:center;justify-content:center}
.collapse{display:flex;width:100%;align-items:center;justify-content:center;border-radius:6px;padding:8px 0;color:#fff}
.collapse:hover{opacity:.75}
.main{position:relative;margin-left:114px;width:calc(100% - 114px);height:100%;min-height:100vh;overflow-x:auto;background:#fff}

/* ---- Header row (analytics/index.jsx ~1258-1326 + heading.jsx) ---- */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;background:#fff}
.hl{display:flex;align-items:center;min-width:0}
.heading{display:flex;align-items:baseline;gap:8px;height:60px;margin-top:4px;padding:16px 20px;background:#fff}
.heading .h1{font-size:30px;line-height:36px;font-weight:500;white-space:nowrap}
.heading .hsub{display:flex;align-items:baseline;gap:8px;font-size:20px;line-height:28px;font-weight:500}
/* The Heading's empty subcontent slot adds an 8px gap: pull the button back so it sits the title's 20px padding away. */
.dgw[hidden]{display:none}
.hr{display:flex;align-items:center;gap:12px;margin:8px 20px 0 0}
.tabs{display:flex;align-items:center;height:36px;padding:4px;border-radius:8px;background:var(--g100)}
.tabs button{display:flex;align-items:center;gap:4px;height:36px;padding:0 16px;border-radius:6px;font-size:14px;line-height:20px;font-weight:600;
  border:1px solid transparent;border-width:0;color:var(--g500);background:transparent;white-space:nowrap}
.tabs button + button{margin-left:4px}
.tabs button:not(.on):hover{color:var(--g800)}
.tabs button.on{background:var(--primary);color:#fff}
.tabs .inf{display:flex;width:16px;height:16px;align-items:center;justify-content:center;color:var(--g500)}
.tabs .on .inf{color:#fff}
.search{position:relative;display:flex;align-items:center}
.search > .i{position:absolute;left:12px;width:18px;height:18px;color:var(--g400)}
.search input{height:36px;width:256px;border:1px solid var(--g200);border-radius:8px;padding:0 40px;font-size:14px;line-height:20px;background:#fff}
.search input::placeholder{color:var(--g400)}
.search input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 1px var(--primary)}

/* ---- shared/ui/Button.jsx: size lg + variant border, as the Module Outputs button ---- */
.obtn{display:flex;align-items:center;gap:8px;height:32px;padding:0 12px;border:1px solid var(--primary);border-radius:6px;background:transparent;
  color:var(--primary);font-size:14px;line-height:20px;font-weight:600;white-space:nowrap;flex-shrink:0}
.obtn:hover{opacity:.7;background:rgba(255,255,255,.9)}
.obtn:disabled{background:var(--g300);color:var(--g500);border-color:transparent;cursor:not-allowed}
/* size lg, primary, !p-0, 32x38 icon buttons */
.ibtn{display:flex;align-items:center;justify-content:center;width:38px;height:32px;border:1px solid transparent;border-radius:6px;background:var(--primary);color:#fff;flex-shrink:0}
.ibtn:hover{background:rgba(255,67,1,.9)}
.ibtn:disabled{background:var(--g300);color:var(--g500);cursor:not-allowed}

/* shared/components/Tooltip.jsx */
.tipw{position:relative;display:inline-block}
.tip{position:absolute;z-index:50;bottom:100%;left:50%;margin-bottom:8px;transform:translateX(-50%);width:max-content;max-width:200px;padding:4px 8px;
  border:1px solid var(--g300);border-radius:4px;background:var(--g100);color:var(--g600);font-size:12px;line-height:16px;white-space:normal;overflow-wrap:break-word;
  opacity:0;pointer-events:none;transition:opacity .2s}
.tip.b{bottom:auto;top:100%;margin:8px 0 0}
.tipw:hover > .tip{opacity:1}

/* ---- Filter toolbar (~1331-1681) ---- */
.pbody{display:flex;flex-direction:column;height:calc(100vh - 64px);min-height:0;min-width:0;background:#fff}
.fbar{position:relative;border-bottom:1px solid var(--g200);padding:16px 20px 12px}
.frow{display:flex;align-items:flex-start;gap:12px}
.fleft{display:flex;flex:1;flex-wrap:wrap;align-items:center;gap:12px;min-width:0}
.fright{display:flex;flex-shrink:0;align-items:flex-start;gap:8px}
/* Filter.jsx / MultiSelectFilter.jsx / TimeRangeDropdown chip */
.chip{position:relative;display:flex;align-items:center;justify-content:space-between;gap:8px;height:38px;padding:0 12px;border-radius:8px;background:#fff;
  font-size:13px;font-weight:500;color:var(--g700);white-space:nowrap;transition:background-color .15s}
.chip:hover{background:var(--g50)}
.chip.g6{gap:6px}
.chip.tr:hover{background:var(--g100)}
.chip .t{overflow:hidden;text-overflow:ellipsis}
.chip .i{width:14px;height:14px;color:var(--g500);transition:transform .15s}
.chip[aria-expanded="true"] .i{transform:rotate(180deg)}
.chip:disabled{cursor:not-allowed;opacity:.6}
.badge{position:absolute;top:-4px;right:-4px;display:flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:999px;
  background:var(--primary);color:#fff;font-size:10px;line-height:1;box-shadow:var(--shadow-sm)}
.dd{position:absolute;left:0;top:100%;z-index:50;margin-top:4px;max-height:240px;overflow-y:auto;border:1px solid var(--g200);border-radius:8px;background:#fff;box-shadow:var(--shadow-lg)}
.opt{display:flex;align-items:center;gap:10px;padding:8px 12px;color:var(--g700);cursor:pointer;transition:background-color .15s;white-space:nowrap}
.opt:hover{background:var(--g50)}
.opt .l{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis}
.cb{display:flex;align-items:center;justify-content:center;width:14px;height:14px;flex-shrink:0;border:1px solid var(--g300);border-radius:2px;background:#fff}
.cb.on{border-color:var(--g900)}
.cb.on::after{content:"";width:8px;height:8px;border-radius:1px;background:var(--g900)}
.cb.r{border-radius:999px} .cb.r.on::after{border-radius:999px}
.ddh{padding:8px 12px;font-size:12px;line-height:16px;font-weight:600;text-transform:uppercase;letter-spacing:.025em;color:var(--g500);white-space:nowrap}

/* ---- TimeRangeDropdown panel (index.jsx ~48-407, react-datepicker + frinks-dp overrides) ---- */
.trw{position:relative;display:flex;flex-direction:column;gap:4px;z-index:32}
.trp{position:absolute;left:0;top:100%;z-index:40;margin-top:4px;width:380px;overflow:hidden;border:1px solid var(--g200);border-radius:8px;background:#fff;box-shadow:var(--shadow-xl)}
.trtabs{display:flex;border-bottom:1px solid var(--g100)}
.trtabs button{flex:1;padding:10px 12px;font-size:12px;line-height:16px;font-weight:600;background:var(--g50);color:var(--g600);transition:background-color .15s}
.trtabs button:hover{background:var(--g100)}
.trtabs button.on{background:var(--primary);color:#fff}
.dp{width:100%;padding:8px}
.rdp{position:relative;display:inline-block;width:100%;background:#fff;color:#000;font-size:.8rem;font-family:inherit}
.rdp-nav{position:absolute;top:14px;z-index:1;display:flex;align-items:center;justify-content:center;width:32px;height:32px;padding:0;overflow:hidden;text-indent:-999em;background:none}
.rdp-nav.prev{left:2px} .rdp-nav.next{right:2px}
.rdp-nav .ico{position:relative;top:-1px;width:0;font-size:20px;white-space:nowrap}
.rdp-nav .ico::before{content:"";position:absolute;top:6px;display:block;width:9px;height:9px;border-style:solid;border-color:var(--g400);border-width:2px 2px 0 0}
.rdp-nav.prev .ico::before{transform:rotate(225deg);right:-7px}
.rdp-nav.next .ico::before{transform:rotate(45deg);left:-7px}
.rdp-nav:hover .ico::before{border-color:#a6a6a6}
.rdp-head{position:relative;text-align:center;background:#fff;border-bottom:1px solid #f0f0f0;padding:12px 0 8px}
.rdp-month{font-size:15px;font-weight:600;color:#111;margin-bottom:8px;line-height:normal}
.rdp-names{display:flex;justify-content:space-around;padding:0 4px;margin-bottom:-8px;white-space:nowrap}
.rdp-names div{width:calc(100% / 7);margin:0;text-align:center;color:var(--g400);font-size:12px;font-weight:500;line-height:36px}
.rdp-body{margin:0;padding:0 4px 4px;text-align:center}
.rdp-week{display:flex;justify-content:flex-start;white-space:nowrap}
.day{position:relative;display:inline-flex;align-items:center;justify-content:center;width:calc(100% / 7);height:39px;line-height:39px;margin:0;padding:0;
  border-radius:50%;font-size:13px;color:var(--g700);cursor:pointer;transition:all .2s ease}
.day:hover:not(.sel):not(.rs):not(.re):not(.single){background-image:radial-gradient(circle,#fff3ee 17px,transparent 18px);color:var(--dp)}
.day.sel,.day.single{background:radial-gradient(circle,var(--dp) 17px,transparent 18px) center no-repeat;color:#fff;font-weight:600}
.day.today{font-weight:800;text-decoration:underline}
.day.dis{color:var(--g300);cursor:not-allowed}
.day.dis:hover{background-image:none;color:var(--g300)}
.day.inr{background-color:transparent;background-image:linear-gradient(#fff3ee,#fff3ee);background-size:100% 34px;background-repeat:no-repeat;background-position:center;color:var(--dp);border-radius:0}
.day.rs{background-image:radial-gradient(circle,var(--dp) 17px,transparent 18px),linear-gradient(to right,transparent 50%,#fff3ee 50%);background-size:100% 100%,100% 34px;
  background-position:center,center;background-repeat:no-repeat,no-repeat;color:#fff;border-radius:0}
.day.re{background-image:radial-gradient(circle,var(--dp) 17px,transparent 18px),linear-gradient(to left,transparent 50%,#fff3ee 50%);background-size:100% 100%,100% 34px;
  background-position:center,center;background-repeat:no-repeat,no-repeat;color:#fff;border-radius:0}
.day.rs.re{background:radial-gradient(circle,var(--dp) 17px,transparent 18px) center no-repeat;border-radius:50%}
.trtime{display:flex;align-items:center;gap:8px;border-top:1px solid var(--g100);padding:12px 16px}
.trtime span{width:48px;font-size:12px;line-height:16px;font-weight:500;color:var(--g500)}
/* index.css input[type='time'] wins over the utility classes except !border (1px) */
.trtime input{flex:1;min-width:0;border:1px solid #000;border-radius:5px;padding:3px;margin-left:0;font-size:medium;background:var(--g50);transition:all .15s}
.trtime input:focus{outline:none;border-color:var(--primary);background:#fff;box-shadow:0 0 0 1px var(--primary)}

/* ---- Summary bar (~1684-1724) ---- */
.sum{display:flex;border-bottom:1px solid var(--g200);background:#fff}
.sum > div{display:flex;flex-grow:1;align-items:center;padding:10px 20px;border-right:1px solid var(--g200);font-size:14px;line-height:20px}
.sum > div:last-child{border-right:0}
.sum span{font-weight:500}
.sum b{margin-left:auto;font-weight:600}
.s-total span{color:var(--g600)}
.s-pass{background:var(--green50);color:var(--green700)}
.s-fail{background:var(--red50);color:var(--red600)}
.s-def{background:var(--orange50);color:var(--orange600)}
.s-rj{background:var(--blue50)} .s-rj span{color:var(--blue600)}

/* ---- ResultTable.jsx / shared/ui/Table.jsx ---- */
.tarea{position:relative;display:flex;flex:1;min-height:0;min-width:0;overflow:hidden}
.tcol{margin-top:12px;display:flex;flex:1;flex-direction:column;min-width:0}
.tpad{display:flex;flex:1;flex-direction:column;min-height:0;min-width:0;overflow:hidden;padding:0 20px 20px}
.tscroll{flex:1;min-height:0;min-width:0;overflow:auto}
table{width:100%;min-width:100%;border-collapse:collapse;table-layout:fixed}
thead{position:sticky;top:0;z-index:11}
th{position:sticky;top:0;z-index:11;background:var(--primary);color:#fff;font-size:16px;line-height:24px;font-weight:500;text-align:center;padding:16px 8px}
th::after{content:"";position:absolute;top:10px;bottom:10px;right:0;width:2px;border-radius:16px;background:#fff}
th:last-child::after{display:none}
tbody{background:#fff;border-top:1px solid var(--g300)}
tbody tr + tr{border-top:1px solid var(--g200)}
td{padding:8px;color:#000;overflow:visible;vertical-align:middle}
td > div{display:flex;align-items:center;justify-content:center;width:100%;height:100%;text-align:center}
td.empty{padding:8px 0;text-align:center;font-size:16px;color:var(--g600);background:#fff}
.res{font-size:14px;line-height:20px;font-weight:600}
.res.p{color:var(--green600)} .res.f{color:var(--red500)}
.lnk{display:flex;align-items:center;gap:6px;color:var(--blue500);font-weight:500;transition:color .15s}
.lnk:hover{color:var(--indigo800)}
.pager{display:flex;align-items:center;justify-content:flex-end;gap:16px;border-top:1px solid var(--g200);padding:8px 16px}
.pager span{font-size:14px;line-height:20px;color:var(--g500)}
.pager button{display:flex;border-radius:4px;padding:4px}
.pager button:hover{background:var(--g100)}
.pager button:disabled{opacity:.3}
.pager .i{width:18px;height:18px}

/* ---- modules/modal/index.jsx ---- */
.ov{position:fixed;left:0;top:0;z-index:99999;width:100vw;height:100vh;border-radius:8px;background:var(--overlay);transition:opacity .15s}
.md{position:relative;top:50%;margin:0 auto;transform:translateY(-50%);width:100%;max-width:1024px;border-radius:8px;background:#fff;text-align:left;box-shadow:var(--shadow-xl)}
.md-in{border-radius:8px;background:#fff;display:flex;flex-direction:column;color:#000}
.md-head{display:flex;align-items:center;justify-content:space-between;padding:16px 24px}
.md-title{display:flex;align-items:baseline;gap:8px;min-width:0}
.md-title h3{font-size:16px;line-height:24px;font-weight:600;color:var(--g800);text-align:left}
.md-title span{font-size:14px;line-height:20px;color:var(--g500);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.md-x{display:flex;cursor:pointer}
/* Dimension Graph modal body */
.dgc{display:flex;align-items:center;gap:12px;padding:0 24px 12px}
.dgc .sp{margin-left:auto}
.dgdd{max-height:320px;min-width:100%}
.dgdd .u{margin-left:auto;padding-left:24px;font-size:13px;color:var(--g500)}
.dgdd .opt.off{color:var(--g400);cursor:not-allowed}
.dgdd .opt.off:hover{background:transparent}
.dgdd .opt.off .u{color:var(--g400)}
.dgdd .opt.off .cb{border-color:var(--g200)}
.dlw{position:relative;z-index:31}
.mnu{position:absolute;right:0;top:100%;z-index:40;margin-top:4px;min-width:168px;padding:4px 0;border:1px solid var(--g200);border-radius:8px;background:#fff;box-shadow:var(--shadow-lg)}
.mnu button{display:flex;width:100%;align-items:center;gap:10px;padding:8px 12px;text-align:left;font-size:14px;line-height:20px;font-weight:500;color:var(--g700);white-space:nowrap}
.mnu button:hover{background:var(--g50)}
.mnu .i{color:var(--g500)}
.dglim{padding:0 24px 8px;font-size:12px;line-height:16px;color:var(--g500)}
.dgchart{height:440px;padding:0 24px 24px}
.dgcv{position:relative;width:100%;height:100%}
.dgempty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;line-height:20px;color:var(--g500)}

/* Prototype-only switch, shown when a screen is opened on its own (hidden inside the workflow shell) */
.proto{position:fixed;left:130px;bottom:12px;z-index:200;display:flex;align-items:center;gap:8px;padding:4px 4px 4px 10px;border:1px dashed var(--g300);border-radius:999px;background:#fff;
  font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--g600);box-shadow:var(--shadow-sm)}
.seg{display:inline-flex;border:1px solid var(--g300);border-radius:999px;padding:2px}
.seg button{font-size:12px;font-weight:600;letter-spacing:0;text-transform:none;padding:2px 10px;border-radius:999px;color:var(--g500)}
.seg button[aria-pressed="true"]{background:var(--sidebar);color:#fff}
.embed .proto{display:none}

@media (max-width:767px){
  .side{display:none}
  .main{margin-left:0;width:100%}
  .top{flex-wrap:wrap}
  .heading{padding:12px 16px}
  .heading .h1{font-size:24px;line-height:32px}
  .hr{margin:0 16px 8px;flex-wrap:wrap}
  .search input{width:200px}
  .frow{flex-wrap:wrap}
  .tpad{padding:0 16px 16px}
  table{min-width:900px}
  .sum{flex-wrap:wrap} .sum > div{flex-basis:50%}
  .md{max-width:calc(100vw - 16px)}
  .dgc{flex-wrap:wrap;padding:0 16px 12px}
  .md-head{padding:12px 16px}
  .dgchart{padding:0 16px 16px;height:360px}
  .trp{width:min(380px,calc(100vw - 32px))}
  .proto{left:12px}
}
</style>
</head>
<body>
<script>try { if (window.self !== window.top) document.documentElement.classList.add('embed'); } catch (e) { document.documentElement.classList.add('embed'); }</script>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-x" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></symbol>
  <symbol id="i-edit2" viewBox="0 0 24 24"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></symbol>
  <symbol id="i-dl" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></symbol>

<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const icon = (id, cls) => `<svg class="i${cls ? ' ' + cls : ''}"><use href="#${id}"/></svg>`;

  if (typeof Chart !== 'undefined') Chart.defaults.font.family = "'Outfit', sans-serif";

  // ---------- URL: mode + step ----------
  const params = new URLSearchParams(location.search);
  const mode = params.get('mode') === 'today' ? 'today' : 'after';
  const after = mode === 'after';
  const STATES = ['dims', 'modal-empty', 'pick', 'one', 'multi', 'units', 'range', 'download', 'nodata', 'nodims', 'minute', 'limit'];
  let stateName = params.get('state') || 'dims';
  if (!STATES.includes(stateName)) stateName = 'dims';

  // ---------- Shared state + this step's overrides ----------
  let S = DG.load();
  const BOTH = ['Bracket 120', 'Bracket 150'];
  const D1 = { variant: 'Bracket 120', id: 'Distance_1' };
  const MULTI = [D1, { variant: 'Bracket 120', id: 'Distance_2' }, { variant: 'Bracket 120', id: 'Angle_1' }];
  const MODAL_STATES = ['modal-empty', 'pick', 'one', 'multi', 'units', 'range', 'download', 'nodata', 'limit'];
  const ui = { tab: 'cycle', page: 1, modal: false, mRange: null, dimsOpen: false, dlOpen: false, instOpen: false, varOpen: false, hasData: false };
  (function applyState() {
    const bracket = () => { S.instance = 'Bracket Line'; if (S.variants.length === 0 || !S.variants.every((v) => BOTH.includes(v))) S.variants = BOTH.slice(); };
    switch (stateName) {
      case 'dims': S.instance = 'Bracket Line'; S.variants = BOTH.slice(); break;
      case 'modal-empty': bracket(); S.dims = []; break;
      case 'pick': bracket(); S.dims = [D1]; ui.dimsOpen = true; break;
      case 'one': bracket(); S.dims = [D1]; break;
      case 'multi': bracket(); S.dims = MULTI.slice(); break;
      case 'units': bracket(); S.dims = [D1, { variant: 'Bracket 120', id: 'Angle_1' }]; ui.dimsOpen = true; break;
      case 'range': case 'download': case 'nodata': case 'limit':
        bracket(); if (!S.dims.length) S.dims = MULTI.slice(); if (stateName === 'download') ui.dlOpen = true; break;
      case 'nodims': S.instance = 'Label Check'; S.variants = ['Label 200', 'Label 300']; S.dims = []; break;
      case 'minute': S.instance = 'Bracket Line'; S.variants = BOTH.slice(); ui.tab = 'minute'; break;
      default: break;
    }
    S = DG.normalize(S);
    DG.save(S);
    if (after && MODAL_STATES.includes(stateName)) {
      ui.modal = true;
      ui.mRange = { from: S.range.from, to: S.range.to };
      const today = DG.dayStart(Date.now());
      if (stateName === 'range') ui.mRange = { from: today - 2 * DG.DAY, to: DG.dayEnd(today) };
      if (stateName === 'nodata') ui.mRange = { from: new Date(2026, 8, 15).getTime(), to: DG.dayEnd(new Date(2026, 8, 15).getTime()) };
      if (stateName === 'limit') ui.mRange = { from: DG.DATA_START - 6 * 3600000, to: DG.dayEnd(today) };
    } else { ui.dimsOpen = false; ui.dlOpen = false; }
  })();
  const persist = () => DG.save(S);
  const instObj = () => DG.instance(S.instance);
  const showDgButton = () => after && ui.tab === 'cycle' && !!S.instance && DG.hasDims(S.instance);

  // ---------- TimeRangeDropdown (index.jsx 48-407) ----------
  const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  function TimeRange(root, getRange, setRange, onOpen) {
    const st = { open: false, tab: 'start', start: null, end: null, view: null };
    const sync = () => { const r = getRange(); st.start = r ? new Date(r.from) : null; st.end = r ? new Date(r.to) : null; };
    sync();
    const selected = () => (st.tab === 'start' ? st.start : st.end);
    const pad = (n) => String(n).padStart(2, '0');
    const hm = (d) => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
    const dOnly = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
    function viewFor() { const s = selected() || new Date(); return new Date(s.getFullYear(), s.getMonth(), 1); }
    function commit() { if (st.start && st.end) setRange({ from: st.start.getTime(), to: st.end.getTime() }); }
    function calendar() {
      const v = st.view, y = v.getFullYear(), m = v.getMonth();
      const now = new Date(), maxD = dOnly(now), minD = st.tab === 'end' && st.start ? dOnly(st.start) : null;
      const first = new Date(y, m, 1), gridStart = new Date(y, m, 1 - first.getDay());
      const last = new Date(y, m + 1, 0);
      const s = st.start ? dOnly(st.start) : null, e = st.end ? dOnly(st.end) : null, sel = selected() ? dOnly(selected()) : null;
      const prevOk = !(minD != null && new Date(y, m, 0).getTime() < minD);
      const nextOk = new Date(y, m + 1, 1).getTime() <= maxD;
      let weeks = '', d = new Date(gridStart);
      do {
        let w = '';
        for (let i = 0; i < 7; i++) {
          const t = d.getTime(), cls = ['day'];
          if (t === sel) cls.push('sel');
          if (t === dOnly(now)) cls.push('today');
          const dis = t > maxD || (minD != null && t < minD);
          if (dis) cls.push('dis');
          if (s != null && e != null) { if (t >= s && t <= e) cls.push('inr'); if (t === s) cls.push('rs'); if (t === e) cls.push('re'); }
          else if (s != null && t === s) cls.push('single');
          else if (e != null && t === e) cls.push('single');
          w += `<div class="${cls.join(' ')}" role="option" aria-disabled="${dis}" data-day="${t}">${d.getDate()}</div>`;
          d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1);
        }
        weeks += `<div class="rdp-week">${w}</div>`;
      } while (d.getTime() <= last.getTime());
      return `<div class="rdp">` +

  // Plotted series: one per selected dimension, cycles of its variant in the modal's range (latest 20,000 cycles).

  // Time ticks on round local times, labelled DD/MM HH:mm

  function timeTicks(min, max, px) {

    const d0 = new Date(min); d0.setHours(0, 0, 0, 0);
    let t = d0.getTime();
    const out = [];
    if (step >= 1440 * 60000) { while (t < min) t += DG.DAY; for (; t <= max; t += step) out.push(t); }

    const headH = Math.round(44 * k), pad = Math.round(16 * k);
    const out = document.createElement('canvas');
    out.width = cw + pad * 2; out.height = ch + headH + pad;
    const g = out.getContext('2d');
    g.fillStyle = '#ffffff'; g.fillRect(0, 0, out.width, out.height);
    g.fillStyle = '#1f2937'; g.font = `600 ${Math.round(15 * k)}px Outfit, sans-serif`; g.textBaseline = 'middle';
    g.fillText(`${S.instance} · Dimension Graph · ${DG.rangeText(ui.mRange)}`, pad, Math.round(headH / 2 + 4 * k));
    if (src) g.drawImage(src, pad, headH);
    else { g.fillStyle = '#6b7280'; g.font = `400 ${Math.round(14 * k)}px Outfit, sans-serif`; g.textAlign = 'center'; g.fillText($('dgEmpty').textContent, out.width / 2, headH + ch / 2); }
    out.toBlob((b) => { if (b) saveBlob(b, fileStem() + '.png'); }, 'image/png');
  });
  $('dlCsv').addEventListener('click', () => {
    ui.dlOpen = false; renderModalControls();
    const { cyc } = series();
    const names = S.dims.map((d) => d.id);
    const header = S.dims.map((d) => {
      const def = DG.dimOf(S.instance, d.variant, d.id), base = `${d.id} (${def.unit})`;
      return names.filter((n) => n === d.id).length > 1 ? `${d.variant} · ${base}` : base;   // same name in two variants: say which
    });
    const q = (s) => (/[",\n]/.test(s) ? `"${String(s).replace(/"/g, '""')}"` : String(s));
    const lines = [['Timestamp', 'Variant'].concat(header).map(q).join(',')];
    cyc.forEach((c) => {
      lines.push([DG.fmtFull(c.t), c.variant].concat(S.dims.map((d) => (d.variant === c.variant && c.vals[d.id] != null ? String(c.vals[d.id]) : ''))).map(q).join(','));
    });
    saveBlob(new Blob(['﻿' + lines.join('\r\n') + '\r\n'], { type: 'text/csv;charset=utf-8' }), fileStem() + '.csv');
  });

  // ---------- Prototype mode switch (standalone only) ----------
  $('seg').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-mode]');
    if (!b || b.dataset.mode === mode) return;
    const p = new URLSearchParams(location.search); p.set('mode', b.dataset.mode);
    location.replace(location.pathname + '?' + p.toString());
  });

  // Another tab changed the shared state: follow it.
  window.addEventListener('storage', (e) => {
    if (e.key !== DG.KEY) return;
    S = DG.load();
    renderPage();
    if (ui.modal) { renderDims(); renderChart(); renderModalControls(); }
  });
  window.addEventListener('resize', () => renderTable());

  // ---------- First paint ----------
  renderPage();
  if (ui.modal) {
    $('dg').hidden = false;
    modalTR.sync();
    if (stateName === 'range') modalTR.setOpen(true);
    renderDims(); renderChart(); renderModalControls();
  }
  // Canvas text needs the web font: redraw once Outfit is ready.
  if (document.fonts && document.fonts.load) {
    Promise.all([document.fonts.load("500 13px Outfit"), document.fonts.load("400 12px Outfit"), document.fonts.load("600 15px Outfit")])
      .then(() => { if (ui.modal) renderChart(); }).catch(() => {});
  }
})();
</script>
</body>
</html>
